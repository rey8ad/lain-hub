<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>present day, present time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030704;
    --green: #33ff66;
    --teal: #00e5cc;
    --dim: #1a8f4d;
    --dark-dim: #0c3b22;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 80px;
    position: relative;
    overflow-x: hidden;
  }

  /* CRT scanlines */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,20,10,0.35) 3px,
      rgba(0,0,0,0) 4px
    );
    z-index: 50;
  }

  /* CRT vignette + flicker */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.6) 100%);
    animation: flicker 4s infinite;
    z-index: 51;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.85; }
    94% { opacity: 1; }
    97% { opacity: 0.9; }
    98% { opacity: 1; }
  }

  /* Lain background image, dimmed under everything */
  .lain-bg {
    position: fixed;
    inset: -4%;
    z-index: 1;
    pointer-events: none;
    background: url('lain.png') center top / cover no-repeat;
    opacity: 0.18;
    filter: grayscale(0.4) hue-rotate(70deg);
    animation: bg-breathe 14s ease-in-out infinite;
  }
  @keyframes bg-breathe {
    0%, 100% { transform: scale(1); opacity: 0.16; }
    50% { transform: scale(1.05) translateY(-6px); opacity: 0.22; }
  }
  .lain-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, var(--bg) 95%);
  }

  /* floating data particles */
  #particles {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }
  #particles span {
    position: absolute;
    bottom: -10px;
    color: rgba(51,255,102,0.35);
    font-size: 12px;
    font-family: 'Share Tech Mono', monospace;
    animation: rise linear infinite;
    text-shadow: 0 0 6px rgba(51,255,102,0.5);
    white-space: nowrap;
  }
  @keyframes rise {
    to { transform: translateY(-110vh) rotate(8deg); opacity: 0; }
  }

  /* random fullscreen glitch burst */
  #glitch-flash {
    position: fixed;
    inset: 0;
    z-index: 60;
    pointer-events: none;
    opacity: 0;
    mix-blend-mode: screen;
    background:
      repeating-linear-gradient(to bottom,
        transparent 0 6px,
        rgba(51,255,102,0.08) 6px 7px,
        transparent 7px 13px,
        rgba(0,229,204,0.07) 13px 14px),
      linear-gradient(100deg, transparent 30%, rgba(51,255,102,0.10) 45%, transparent 55%, rgba(255,51,85,0.06) 70%, transparent 80%);
  }
  #glitch-flash.on { animation: burst 0.28s steps(3) 1; }
  @keyframes burst {
    0% { opacity: 0; transform: translateX(0); }
    33% { opacity: 0.9; transform: translateX(-8px) skewX(2deg); }
    66% { opacity: 0.5; transform: translateX(6px) skewX(-3deg); }
    100% { opacity: 0; transform: none; }
  }

  .wrap { width: 100%; max-width: 520px; z-index: 10; }

  .boot {
    font-size: 13px;
    color: var(--dim);
    margin-bottom: 28px;
    line-height: 1.6;
    min-height: 4em;
  }
  .boot .ok { color: var(--teal); }
  .boot .caret::after { content: "▌"; animation: blink .7s steps(1) infinite; color: var(--teal); }

  .avatar {
    width: 120px;
    height: 120px;
    margin: 0 auto 18px;
    border: 1px solid var(--dark-dim);
    padding: 4px;
    position: relative;
    animation: avatar-glitch 5s infinite steps(1);
    box-shadow: 0 0 20px rgba(51,255,102,0.15);
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(0.8) contrast(1.1) hue-rotate(60deg);
  }
  @keyframes avatar-glitch {
    0%, 93%, 100% { transform: none; }
    94% { transform: translate(3px, -2px) skewX(2deg); border-color: var(--teal); }
    96% { transform: none; }
  }

  header { text-align: center; margin-bottom: 34px; }

  h1.glitch {
    font-family: 'VT323', monospace;
    font-size: clamp(38px, 9vw, 58px);
    letter-spacing: 4px;
    color: var(--green);
    text-shadow: 0 0 8px rgba(51,255,102,0.7), 0 0 24px rgba(51,255,102,0.3);
    position: relative;
    animation: glitch-skew 6s infinite steps(1);
  }
  h1.glitch::before, h1.glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0; left: 0; width: 100%;
    overflow: hidden;
  }
  h1.glitch::before {
    color: var(--teal);
    animation: glitch-a 3s infinite steps(1);
    clip-path: inset(0 0 60% 0);
  }
  h1.glitch::after {
    color: #ff3355;
    animation: glitch-b 2.4s infinite steps(1);
    clip-path: inset(55% 0 0 0);
  }
  @keyframes glitch-a {
    0%, 90%, 100% { transform: none; opacity: 0; }
    91% { transform: translate(-4px, -2px); opacity: 1; }
    93% { transform: translate(3px, 1px); opacity: 1; }
    95% { transform: none; opacity: 0; }
  }
  @keyframes glitch-b {
    0%, 85%, 100% { transform: none; opacity: 0; }
    86% { transform: translate(4px, 2px); opacity: 1; }
    89% { transform: translate(-3px, -1px); opacity: 1; }
    91% { transform: none; opacity: 0; }
  }
  @keyframes glitch-skew {
    0%, 88%, 100% { transform: none; }
    89% { transform: skewX(3deg); }
    90% { transform: skewX(-2deg); }
    91% { transform: none; }
  }

  .sub {
    color: var(--dim);
    font-size: 14px;
    margin-top: 8px;
    letter-spacing: 2px;
  }
  .cursor-blink::after {
    content: "▌";
    animation: blink 1s steps(1) infinite;
    color: var(--teal);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .links { display: flex; flex-direction: column; gap: 14px; }

  /* staggered entrance */
  a.node, #audio-toggle, footer {
    opacity: 0;
    animation: fade-up .5s ease forwards;
  }
  a.node:nth-child(1) { animation-delay: 1.6s; }
  a.node:nth-child(2) { animation-delay: 1.75s; }
  a.node:nth-child(3) { animation-delay: 1.9s; }
  a.node:nth-child(4) { animation-delay: 2.05s; }
  a.node:nth-child(5) { animation-delay: 2.2s; }
  a.node:nth-child(6) { animation-delay: 2.35s; }
  a.node:nth-child(7) { animation-delay: 2.5s; }
  #audio-toggle { animation-delay: 2.7s; }
  footer { animation-delay: 2.9s; }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); filter: blur(3px); }
    to { opacity: 1; transform: none; filter: none; }
  }

  a.node {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: var(--green);
    border: 1px solid var(--dark-dim);
    background: linear-gradient(to right, rgba(26,143,77,0.08), transparent 60%);
    padding: 14px 18px;
    font-size: 17px;
    letter-spacing: 1px;
    position: relative;
    transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
  }
  a.node:hover {
    border-color: var(--green);
    background: linear-gradient(to right, rgba(51,255,102,0.12), transparent 70%);
    box-shadow: 0 0 14px rgba(51,255,102,0.25), inset 0 0 10px rgba(51,255,102,0.05);
    transform: translateX(4px);
  }
  a.node:hover .arrow { opacity: 1; transform: translateX(0); }

  a.node svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; filter: drop-shadow(0 0 4px rgba(51,255,102,0.4)); }

  .handle { color: var(--dim); font-size: 13px; margin-left: auto; }
  a.node:hover .handle { color: var(--teal); }

  .arrow { margin-left: auto; opacity: 0; transition: .15s; color: var(--teal); }
  .handle + .arrow { margin-left: 12px; }

  #audio-toggle {
    display: block;
    margin: 26px auto 0;
    background: transparent;
    border: 1px solid var(--dark-dim);
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    padding: 8px 18px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  #audio-toggle:hover { border-color: var(--green); color: var(--green); }

  footer {
    margin-top: 44px;
    text-align: center;
    color: var(--dark-dim);
    font-size: 12px;
    letter-spacing: 2px;
    line-height: 1.8;
  }

  ::selection { background: var(--green); color: #000; }
</style>

<script>
  // ---- typewriter boot sequence ----
  (function () {
    const boot = document.getElementById('boot');
    const lines = [
      ['> connecting to the Wired... ', '[OK]'],
      ['> protocol: NAVI-07 ... ', '[CONNECTED]'],
      ["> no matter where you go, everyone's connected.", '']
    ];
    let li = 0, ci = 0;
    function tick() {
      if (li >= lines.length) { boot.classList.remove('caret'); return; }
      const text = lines[li][0], ok = lines[li][1];
      boot.innerHTML =
        lines.slice(0, li).map(l => l[0] + '<span class="ok">' + l[1] + '</span>').join('<br>') +
        (li ? '<br>' : '') + text.slice(0, ci);
      if (ci < text.length) {
        ci++;
        setTimeout(tick, 18 + Math.random() * 30);
      } else if (ok) {
        // type out the status tag too
        let k = 0;
        (function tag() {
          if (k <= ok.length) {
            boot.innerHTML =
              lines.slice(0, li).map(l => l[0] + '<span class="ok">' + l[1] + '</span>').join('<br>') +
              (li ? '<br>' : '') + text + '<span class="ok">' + ok.slice(0, k) + '</span>';
            k++;
            setTimeout(tag, 40);
          } else { li++; ci = 0; setTimeout(tick, 250); }
        })();
      } else { li++; ci = 0; setTimeout(tick, 350); }
    }
    boot.classList.add('caret');
    tick();
  })();

  // ---- floating data particles ----
  (function () {
    const holder = document.getElementById('particles');
    const glyphs = ['01', '10', '11', 'CYBERIA', 'LAIN', 'NAVI', '>>', 'wired', '0x1F', 'knights', '...'];
    function spawn() {
      const s = document.createElement('span');
      s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      s.style.left = Math.random() * 100 + '%';
      s.style.fontSize = (9 + Math.random() * 8) + 'px';
      const dur = 9 + Math.random() * 12;
      s.style.animationDuration = dur + 's';
      s.style.opacity = 0.2 + Math.random() * 0.5;
      holder.appendChild(s);
      setTimeout(() => s.remove(), dur * 1000);
    }
    for (let i = 0; i < 14; i++) setTimeout(spawn, i * 900);
    setInterval(spawn, 1100);
  })();

  // ---- random fullscreen glitch bursts ----
  (function () {
    const flash = document.getElementById('glitch-flash');
    function burst() {
      flash.classList.add('on');
      setTimeout(() => flash.classList.remove('on'), 300);
      setTimeout(burst, 4000 + Math.random() * 9000);
    }
    setTimeout(burst, 5000);
  })();

  // ---- audio ----
  // Browsers block autoplay until the visitor interacts with the page,
  // so try to start immediately, then start on first click/tap/key.
  const audio = document.getElementById('bg-audio');
  const toggle = document.getElementById('audio-toggle');

  function setLabel(on) {
    toggle.textContent = on ? '[ sound: on ]' : '[ sound: off ]';
  }

  function startAudio() {
    audio.play().then(() => {
      setLabel(true);
      cleanup();
    }).catch(() => { /* wait for user gesture */ });
  }
  function cleanup() {
    document.removeEventListener('click', startAudio);
    document.removeEventListener('keydown', startAudio);
  }

  document.addEventListener('click', startAudio);
  document.addEventListener('keydown', startAudio);
  window.addEventListener('load', () => setTimeout(startAudio, 300));

  toggle.addEventListener('click', (e) => {
    e.stopPropagation();
    if (audio.paused) { audio.play(); setLabel(true); }
    else { audio.pause(); setLabel(false); }
  });
</script>
